<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><title>ピコ太郎｜QR照合</title><script src="https://unpkg.com/html5-qrcode"></script><style>:root{--navy:#092245;--green:#16a34a;--red:#dc2626;--bg:#f4f7fb}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:#102033}.app{max-width:640px;margin:auto;min-height:100vh;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom)}.head{background:var(--navy);color:#fff;padding:16px 18px;border-radius:0 0 20px 20px}.head h1{margin:0;font-size:26px}.head small{opacity:.8}.progress{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0}.p{padding:10px 5px;border-radius:12px;background:#e2e8f0;text-align:center;font-size:13px;font-weight:800}.p.on{background:#dbeafe;color:var(--navy);outline:2px solid var(--navy)}.p.done{background:#dcfce7;color:#166534}.panel{background:#fff;border-radius:18px;padding:14px;box-shadow:0 6px 20px #00000012}.guide{text-align:center;margin:4px 0 12px}.guide b{font-size:24px;color:var(--navy)}#reader{overflow:hidden;border-radius:15px;min-height:280px}.result{margin-top:12px;border-radius:16px;padding:14px;text-align:center;background:#eef2f7}.result .big{font-size:27px;font-weight:900}.result .sub{margin-top:5px;font-size:13px;word-break:break-all}.ok{background:#dcfce7;color:#166534}.data{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.data div{background:#f8fafc;border-radius:11px;padding:9px;font-size:12px}.data b{display:block;font-size:14px;margin-top:3px;word-break:break-all}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}button{border:0;border-radius:12px;padding:13px;font-weight:800;font-size:15px}.primary{background:var(--navy);color:#fff}.secondary{background:#e2e8f0}.alarm{position:fixed;inset:0;background:var(--red);color:#fff;z-index:99;display:none;align-items:center;justify-content:center;text-align:center;padding:22px}.alarm.show{display:flex}.alarm .x{font-size:80px;font-weight:900}.alarm h2{font-size:42px;margin:4px 0}.alarm p{font-size:19px;font-weight:800}.alarm .codes{background:#ffffff20;border-radius:15px;padding:12px;margin:18px 0;font-size:16px}.note{text-align:center;font-size:11px;color:#64748b;margin:10px}</style></head><body><div class="app"><div class="head"><h1>ピコ太郎</h1><small>QR照合・ポカヨケ</small></div><div class="progress"><div id="s1" class="p on">① 名前</div><div id="s2" class="p">② 箱</div><div id="s3" class="p">③ ロケ</div></div><div class="panel"><div class="guide"><b id="guide">名前のQRを読んでください</b></div><div id="reader"></div><div id="result" class="result"><div class="big">読み取り待ち</div><div class="sub">カメラをQRへ向けてください</div></div><div class="data"><div>作業者<b id="name">―</b></div><div>箱QR<b id="box">―</b></div><div>ロケQR<b id="loc">―</b></div><div>履歴件数<b id="count">0</b></div></div><div class="buttons"><button class="secondary" onclick="resetWorker()">作業者変更</button><button class="primary" onclick="downloadCSV()">CSV出力</button></div></div><div class="note">NG時は解除QR「PICOTARO_UNLOCK」を読むまで警報を停止できません。</div></div><div id="alarm" class="alarm"><div><div class="x">×</div><h2>NG！ ブブーー！！</h2><p>ロケが違います</p><div class="codes">箱：<b id="abox"></b><br>ロケ：<b id="aloc"></b></div><p>🔓 解除QRを読み取ってください</p></div></div><script>const UNLOCK="PICOTARO_UNLOCK";let phase=1,worker="",boxCode="",locCode="",locked=false,last="",lastAt=0,alarmTimer=null,audioCtx=null;const $=id=>document.getElementById(id);let logs=JSON.parse(localStorage.getItem("picotaro_logs")||"[]");updateCount();function ctx(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();return audioCtx}function tone(f,d,delay=0,type="sine"){try{let c=ctx(),o=c.createOscillator(),g=c.createGain(),t=c.currentTime+delay;o.type=type;o.frequency.value=f;g.gain.value=.22;o.connect(g);g.connect(c.destination);o.start(t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.stop(t+d)}catch(e){}}function beep(){tone(1150,.08)}function ding(){tone(720,.15);tone(1080,.25,.16)}function buzz(){tone(170,.35,0,"sawtooth");tone(120,.42,.25,"sawtooth")}function startAlarm(){buzz();if(navigator.vibrate)navigator.vibrate([350,150,350]);alarmTimer=setInterval(()=>{buzz();if(navigator.vibrate)navigator.vibrate([350,150,350])},1100)}function stopAlarm(){clearInterval(alarmTimer);alarmTimer=null;if(navigator.vibrate)navigator.vibrate(0)}function saveLog(result){const now=new Date();logs.push({datetime:now.toLocaleString("ja-JP"),iso:now.toISOString(),worker,box:boxCode,location:locCode,result});localStorage.setItem("picotaro_logs",JSON.stringify(logs));updateCount()}function updateCount(){$("count").textContent=logs.length}function status(big,sub,cls=""){$("result").className="result "+cls;$("result").innerHTML=`<div class="big">${big}</div><div class="sub">${sub||""}</div>`}function steps(a,b,c){$("s1").className="p "+a;$("s2").className="p "+b;$("s3").className="p "+c}function scanned(text){text=text.trim();let now=Date.now();if(text===last&&now-lastAt<1200)return;last=text;lastAt=now;if(locked){if(text===UNLOCK){stopAlarm();locked=false;$("alarm").classList.remove("show");boxCode="";locCode="";$("box").textContent="―";$("loc").textContent="―";phase=2;$("guide").textContent="箱のQRを読んでください";steps("done","on","");status("解除しました","次の箱をスキャンしてください")}return}beep();if(phase===1){worker=text;$("name").textContent=text;phase=2;$("guide").textContent="箱のQRを読んでください";steps("done","on","");status("名前 OK",text,"ok")}else if(phase===2){boxCode=text;$("box").textContent=text;phase=3;$("guide").textContent="ロケのQRを読んでください";steps("done","done","on");status("箱 QR OK",text)}else{locCode=text;$("loc").textContent=text;if(boxCode===locCode){ding();saveLog("OK");status("ピンポン！！ OK","箱とロケが一致しました","ok");steps("done","done","done");setTimeout(()=>{boxCode="";locCode="";$("box").textContent="―";$("loc").textContent="―";phase=2;$("guide").textContent="箱のQRを読んでください";steps("done","on","");status("次の箱をどうぞ","作業者："+worker)},1500)}else{saveLog("NG");locked=true;$("abox").textContent=boxCode;$("aloc").textContent=locCode;$("alarm").classList.add("show");startAlarm()}}}function resetWorker(){if(locked)return;worker="";boxCode="";locCode="";phase=1;$("name").textContent=$("box").textContent=$("loc").textContent="―";$("guide").textContent="名前のQRを読んでください";steps("on","","");status("読み取り待ち","名前QRをスキャンしてください")}function downloadCSV(){const esc=v=>'"'+String(v??"").replaceAll('"','""')+'"';let rows=[["日時","作業者","箱QR","ロケQR","判定"],...logs.map(x=>[x.datetime,x.worker,x.box,x.location,x.result])];let csv="\uFEFF"+rows.map(r=>r.map(esc).join(",")).join("\r\n");let blob=new Blob([csv],{type:"text/csv;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="picotaro_history.csv";a.click();URL.revokeObjectURL(a.href)}const qr=new Html5Qrcode("reader");qr.start({facingMode:"environment"},{fps:12,qrbox:{width:240,height:190}},scanned,()=>{}).catch(()=>status("カメラを起動できません","Safariのカメラ権限とHTTPS環境を確認してください"));</script></body></html>
