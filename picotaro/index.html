<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>ピコ太郎｜QR照合</title><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><style>:root{--n:#092245;--r:#dc2626}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:#f4f7fb;color:#102033}.app{max-width:640px;margin:auto;padding:14px}.head{background:var(--n);color:#fff;padding:14px 18px;border-radius:18px}.head h1{margin:0}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}.p{padding:9px 4px;border-radius:11px;background:#e2e8f0;text-align:center;font-weight:800}.on{outline:2px solid var(--n);background:#dbeafe}.done{background:#dcfce7;color:#166534}.card{background:#fff;padding:12px;border-radius:18px}.guide{text-align:center;font-size:22px;font-weight:900;color:var(--n);margin-bottom:8px}#reader{width:100%;min-height:400px;border-radius:15px;overflow:hidden;background:#111}#reader video{width:100%!important;height:400px!important;object-fit:cover!important}.result{margin-top:8px;padding:12px;border-radius:14px;background:#eef2f7;text-align:center;font-weight:900}.ok{background:#dcfce7;color:#166534}.data{margin-top:8px;font-size:13px;line-height:1.7}.buttons{display:flex;gap:8px;margin-top:8px}button{flex:1;border:0;border-radius:12px;padding:13px;font-weight:800}.primary{background:var(--n);color:white}.start{position:fixed;inset:0;z-index:200;background:#092245;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}.start button{font-size:22px;background:#fff;color:#092245;padding:18px 32px;min-width:240px}.ng{display:none;position:fixed;inset:0;z-index:300;background:var(--r);color:#fff;align-items:center;justify-content:center;text-align:center;padding:24px}.ng.show{display:flex}.ng .x{font-size:86px;font-weight:1000}.ng h2{font-size:50px;margin:0 0 8px}.ng .codes{background:#ffffff20;border-radius:14px;padding:12px;margin:14px 0;font-size:17px}.ng label{display:block;font-size:18px;font-weight:900;margin:14px 0 7px}.ng input{width:210px;max-width:80vw;text-align:center;font-size:30px;letter-spacing:10px;padding:12px;border:3px solid #fff;border-radius:12px;background:#fff;color:#111}.ng button{display:block;width:210px;margin:10px auto 0;background:#fff;color:#b91c1c;font-size:20px}.err{height:24px;font-weight:900;margin-top:8px}</style></head><body><div id="start" class="start"><div><h1>ピコ太郎</h1><p>音声とカメラを有効にします</p><button onclick="activate()">▶ 照合を開始</button></div></div><div id="ng" class="ng"><div><div class="x">×</div><h2>NG</h2><div>ロケが違います</div><div class="codes">箱：<b id="abox"></b><br>ロケ：<b id="aloc"></b></div><label for="pass">解除パスワード</label><input id="pass" type="tel" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="••••"><button onclick="unlock()">解除する</button><div id="err" class="err"></div></div></div><div class="app"><div class="head"><h1>ピコ太郎</h1><small>QR照合・ポカヨケ</small></div><div class="steps"><div id="s1" class="p on">① 名前</div><div id="s2" class="p">② 箱</div><div id="s3" class="p">③ ロケ</div></div><div class="card"><div id="guide" class="guide">名前のQRを読んでください</div><div id="reader"></div><div id="result" class="result">開始ボタンを押してください</div><div class="data">作業者：<b id="name">―</b>　箱：<b id="box">―</b><br>ロケ：<b id="loc">―</b>　履歴：<b id="count">0</b>件</div><div class="buttons"><button onclick="resetWorker()">作業者変更</button><button class="primary" onclick="downloadCSV()">CSV出力</button></div></div></div><script>const PASS='0000',$=x=>document.getElementById(x);let phase=1,worker='',box='',loc='',locked=false,last='',lastAt=0,timer=null,ac=null,qr=null,master=null;let logs=JSON.parse(localStorage.getItem('picotaro_logs')||'[]');$('count').textContent=logs.length;async function audioReady(){ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')await ac.resume();master=master||ac.createDynamicsCompressor();master.threshold.value=-24;master.knee.value=8;master.ratio.value=10;master.attack.value=.002;master.release.value=.12;master.connect(ac.destination)}function tone(f,d,delay=0,type='sine',vol=.95){try{let o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+delay;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d)}catch(e){}}function scanBeep(){tone(1600,.11,0,'square',1)}function ding(){tone(760,.24,0,'square',1);tone(1200,.4,.22,'square',1);tone(1500,.25,.48,'square',.9)}function buzz(){tone(210,.5,0,'sawtooth',1);tone(105,.55,.22,'square',1);tone(210,.45,.55,'sawtooth',1)}function alarmOn(){buzz();timer=setInterval(buzz,1150)}function alarmOff(){clearInterval(timer);timer=null}function steps(a,b,c){$('s1').className='p '+a;$('s2').className='p '+b;$('s3').className='p '+c}function status(x,ok=false){$('result').className='result'+(ok?' ok':'');$('result').textContent=x}function save(r){let n=new Date();logs.push({datetime:n.toLocaleString('ja-JP'),worker,box,location:loc,result:r});localStorage.setItem('picotaro_logs',JSON.stringify(logs));$('count').textContent=logs.length}function scan(text){if(locked)return;text=text.trim();let n=Date.now();if(!text||(text===last&&n-lastAt<650))return;last=text;lastAt=n;if(ac&&ac.state==='suspended')ac.resume();scanBeep();if(phase===1){worker=text;$('name').textContent=text;phase=2;$('guide').textContent='箱のQRを読んでください';steps('done','on','');status('名前 OK：'+text,true)}else if(phase===2){box=text;$('box').textContent=text;phase=3;$('guide').textContent='ロケのQRを読んでください';steps('done','done','on');status('箱：'+text)}else{loc=text;$('loc').textContent=text;if(box===loc){ding();save('OK');status('ピンポン！！ OK',true);steps('done','done','done');setTimeout(nextBox,1100)}else{save('NG');locked=true;$('abox').textContent=box;$('aloc').textContent=loc;$('pass').value='';$('err').textContent='';$('ng').classList.add('show');alarmOn();setTimeout(()=>$('pass').focus(),180)}}}function unlock(){if($('pass').value===PASS){alarmOff();locked=false;$('ng').classList.remove('show');$('pass').blur();box=loc='';$('box').textContent=$('loc').textContent='―';phase=2;$('guide').textContent='箱のQRを読んでください';steps('done','on','');status('解除しました');ding();last='';lastAt=0}else{$('err').textContent='パスワードが違います';$('pass').value='';$('pass').focus();buzz()}}$('pass').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});function nextBox(){box=loc='';$('box').textContent=$('loc').textContent='―';phase=2;$('guide').textContent='箱のQRを読んでください';steps('done','on','');status('次の箱をどうぞ');last='';lastAt=0}function resetWorker(){if(locked)return;worker=box=loc='';phase=1;$('name').textContent=$('box').textContent=$('loc').textContent='―';$('guide').textContent='名前のQRを読んでください';steps('on','','');status('名前QRをスキャンしてください');last='';lastAt=0}function downloadCSV(){let q=v=>'"'+String(v??'').replaceAll('"','""')+'"',rows=[['日時','作業者','箱QR','ロケQR','判定'],...logs.map(x=>[x.datetime,x.worker,x.box,x.location,x.result])],csv='\uFEFF'+rows.map(r=>r.map(q).join(',')).join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='picotaro_history.csv';a.click()}async function activate(){try{await audioReady();tone(950,.12);$('start').style.display='none';status('カメラ起動中…');let cams=await Html5Qrcode.getCameras();if(!cams.length)throw Error('カメラなし');let rear=cams.find(c=>/back|rear|environment|背面/i.test(c.label))||cams[cams.length-1];qr=new Html5Qrcode('reader',{formatsToSupport:[Html5QrcodeSupportedFormats.QR_CODE],useBarCodeDetectorIfSupported:true});await qr.start(rear.id,{fps:30,qrbox:(w,h)=>({width:Math.floor(w*.96),height:Math.floor(h*.88)}),aspectRatio:1.333334,disableFlip:true,videoConstraints:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080},frameRate:{ideal:30,max:60}}},scan,()=>{});let track=document.querySelector('#reader video')?.srcObject?.getVideoTracks?.()[0];if(track){let caps=track.getCapabilities?.()||{};let adv=[];if(caps.focusMode?.includes('continuous'))adv.push({focusMode:'continuous'});if(caps.zoom){let z=Math.min(caps.zoom.max||1,Math.max(caps.zoom.min||1,1.5));adv.push({zoom:z})}if(adv.length)try{await track.applyConstraints({advanced:adv})}catch(e){}}status('小さいQRもそのままカメラへ向けてください')}catch(e){$('start').style.display='none';status('起動エラー：'+e)}};</script></body></html>
