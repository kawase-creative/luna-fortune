<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>ピコ太郎｜QR照合</title><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><style>:root{--n:#092245;--r:#dc2626}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:#f4f7fb;color:#102033}.app{max-width:640px;margin:auto;padding:14px}.head{background:var(--n);color:#fff;padding:16px 18px;border-radius:18px}.head h1{margin:0}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0}.p{padding:10px 4px;border-radius:11px;background:#e2e8f0;text-align:center;font-weight:800}.on{outline:2px solid var(--n);background:#dbeafe}.done{background:#dcfce7;color:#166534}.card{background:#fff;padding:14px;border-radius:18px}.mode{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:10px}.mode button{background:#e2e8f0;color:#334155;border:2px solid transparent}.mode button.active{background:var(--n);color:#fff;border-color:var(--n)}.guide{text-align:center;font-size:23px;font-weight:900;color:var(--n);margin-bottom:10px}#reader{width:100%;min-height:330px;border-radius:15px;overflow:hidden;background:#111}#reader video{width:100%!important;height:330px!important;object-fit:cover!important}.hid{display:none;height:330px;border:3px dashed #94a3b8;border-radius:15px;background:#f8fafc;align-items:center;justify-content:center;text-align:center;padding:24px}.hid.show{display:flex}.hid .icon{font-size:58px}.hid b{font-size:22px;color:var(--n)}.hid small{display:block;margin-top:12px;color:#64748b;line-height:1.5}.result{margin-top:10px;padding:13px;border-radius:14px;background:#eef2f7;text-align:center;font-weight:900}.ok{background:#dcfce7;color:#166534}.data{margin-top:9px;font-size:13px;line-height:1.8}.buttons{display:flex;gap:8px;margin-top:10px}button{flex:1;border:0;border-radius:12px;padding:13px;font-weight:800}.primary{background:var(--n);color:white}.start{position:fixed;inset:0;z-index:200;background:#092245;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}.start button{font-size:22px;background:#fff;color:#092245;padding:18px 32px;min-width:240px}.ng{display:none;position:fixed;inset:0;z-index:300;background:var(--r);color:#fff;align-items:center;justify-content:center;text-align:center;padding:12px;overflow:auto}.ng.show{display:flex}.ng .x{font-size:58px;font-weight:1000;line-height:1}.ng h2{font-size:38px;margin:0 0 4px}.ng .codes{background:#ffffff20;border-radius:12px;padding:8px;margin:8px 0;font-size:15px;word-break:break-all}.pinlabel{font-size:16px;font-weight:900;margin:7px 0}.pinview{width:210px;margin:0 auto 8px;background:#fff;color:#111;border-radius:12px;padding:9px;font-size:28px;letter-spacing:10px;min-height:50px}.keypad{width:250px;max-width:86vw;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.keypad button{background:#fff;color:#092245;font-size:22px;padding:10px 4px;border-radius:10px;min-height:48px}.keypad .del{font-size:16px}.keypad .unlockbtn{background:#092245;color:#fff;font-size:16px}.err{height:22px;font-weight:900;margin-top:6px}#hidInput{position:fixed;left:-9999px;top:-9999px;opacity:0;width:1px;height:1px}</style></head><body><input id="hidInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"><div id="start" class="start"><div><h1>ピコ太郎</h1><p>音声とカメラを有効にします</p><button onclick="activate()">▶ 照合を開始</button></div></div><div id="ng" class="ng"><div><div class="x">×</div><h2>NG！ ブブーー！！</h2><div>製品が違います</div><div class="codes">カンバン照合値：<b id="abox"></b><br>製品照合値：<b id="aloc"></b></div><div class="pinlabel">解除パスワード</div><div id="pinview" class="pinview">----</div><div class="keypad"><button onclick="pin(1)">1</button><button onclick="pin(2)">2</button><button onclick="pin(3)">3</button><button onclick="pin(4)">4</button><button onclick="pin(5)">5</button><button onclick="pin(6)">6</button><button onclick="pin(7)">7</button><button onclick="pin(8)">8</button><button onclick="pin(9)">9</button><button class="del" onclick="pinDel()">⌫ 削除</button><button onclick="pin(0)">0</button><button class="unlockbtn" onclick="unlock()">解除</button></div><div id="err" class="err"></div></div></div><div class="app"><div class="head"><h1>ピコ太郎</h1><small>QR照合・ポカヨケ</small></div><div class="steps"><div id="s1" class="p on">① 名前</div><div id="s2" class="p">② カンバン</div><div id="s3" class="p">③ 製品</div></div><div class="card"><div class="mode"><button id="camBtn" class="active" onclick="setMode('camera')">📷 カメラ</button><button id="hidBtn" onclick="setMode('reader')">🔫 リーダー</button></div><div id="guide" class="guide">名前のQRを読んでください</div><div id="reader"></div><div id="hidPanel" class="hid"><div><div class="icon">🔫</div><b>Bluetoothリーダー待機中</b><small>iPhoneとBluetooth接続したリーダーで<br>QRを読み取ってください</small></div></div><div id="result" class="result">開始ボタンを押してください</div><div class="data">作業者：<b id="name">―</b><br>カンバン：<b id="box">―</b><br>製品：<b id="loc">―</b><br>履歴：<b id="count">0</b>件</div><div class="buttons"><button onclick="resetWorker()">作業者変更</button><button class="primary" onclick="downloadCSV()">CSV出力</button></div></div></div><script>const PASS='0000',$=x=>document.getElementById(x);let phase=1,worker='',box='',loc='',locked=false,last='',lastAt=0,timer=null,ac=null,qr=null,master=null,mode='camera',cameraRunning=false,hidBuffer='',hidTimer=null,pinCode='';let logs=JSON.parse(localStorage.getItem('picotaro_logs')||'[]');$('count').textContent=logs.length;function kanbanKey(s){return s.length>=81?s.substring(71,81):''}function productKey(s){return s.length>=12?s.substring(2,12):''}async function audioReady(){ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')await ac.resume();master=master||ac.createGain();master.gain.value=3;master.connect(ac.destination)}function tone(f,d,delay=0,type='sine',vol=.55){try{let o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+delay;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d)}catch(e){}}function scanBeep(){tone(1450,.1,0,'square',.5)}function ding(){tone(720,.2,0,'square',.55);tone(1120,.35,.2,'square',.55)}function buzz(){tone(190,.46,0,'sawtooth',.75);tone(110,.5,.25,'square',.75);tone(190,.35,.55,'sawtooth',.75)}function alarmOn(){buzz();timer=setInterval(buzz,1150)}function alarmOff(){clearInterval(timer);timer=null}function steps(a,b,c){$('s1').className='p '+a;$('s2').className='p '+b;$('s3').className='p '+c}function status(x,ok=false){$('result').className='result'+(ok?' ok':'');$('result').textContent=x}function save(r){let n=new Date();logs.push({datetime:n.toLocaleString('ja-JP'),worker,box,location:loc,result:r});localStorage.setItem('picotaro_logs',JSON.stringify(logs));$('count').textContent=logs.length}function pin(n){if(pinCode.length<4){pinCode+=String(n);showPin()}}function pinDel(){pinCode=pinCode.slice(0,-1);showPin()}function showPin(){$('pinview').textContent='●'.repeat(pinCode.length)+'–'.repeat(4-pinCode.length);$('err').textContent=''}function scan(text){if(locked)return;text=String(text||'').trim();let n=Date.now();if(!text||(text===last&&n-lastAt<1200))return;last=text;lastAt=n;if(ac&&ac.state==='suspended')ac.resume();scanBeep();if(phase===1){worker=text;$('name').textContent=text;phase=2;$('guide').textContent='カンバンQRを読んでください';steps('done','on','');status('名前 OK：'+text,true)}else if(phase===2){box=text;$('box').textContent=kanbanKey(text)||text;phase=3;$('guide').textContent='製品QRを読んでください';steps('done','done','on');status('カンバン照合値：'+(kanbanKey(text)||'取得不可'))}else{loc=text;let bk=kanbanKey(box),pk=productKey(loc);$('loc').textContent=pk||text;if(bk&&pk&&bk===pk){ding();save('OK');status('ピンポン！！ OK　照合値：'+bk,true);steps('done','done','done');setTimeout(nextBox,1600)}else{save('NG');locked=true;$('abox').textContent=bk||'取得不可';$('aloc').textContent=pk||'取得不可';pinCode='';showPin();$('ng').classList.add('show');alarmOn()}}async function startCamera(){if(cameraRunning)return;try{if(!qr)qr=new Html5Qrcode('reader',{formatsToSupport:[Html5QrcodeSupportedFormats.QR_CODE],useBarCodeDetectorIfSupported:false});let cams=await Html5Qrcode.getCameras();if(!cams.length)throw Error('カメラなし');let rear=cams.find(c=>/back|rear|environment|背面/i.test(c.label))||cams[cams.length-1];await qr.start(rear.id,{fps:20,qrbox:(w,h)=>{let s=Math.floor(Math.min(w,h)*.78);return{width:s,height:s}},aspectRatio:1.333334,disableFlip:true},scan,()=>{});cameraRunning=true;if(mode==='camera')status('QRを枠いっぱいに映してください')}catch(e){status('カメラ起動エラー：'+e)}}async function stopCamera(){if(qr&&cameraRunning){try{await qr.stop()}catch(e){}cameraRunning=false}}async function setMode(m){if(locked)return;mode=m;$('camBtn').classList.toggle('active',m==='camera');$('hidBtn').classList.toggle('active',m==='reader');if(m==='reader'){await stopCamera();$('reader').style.display='none';$('hidPanel').classList.add('show');$('hidInput').value='';$('hidInput').focus();status('Bluetoothリーダーで読み取ってください')}else{$('hidPanel').classList.remove('show');$('reader').style.display='block';$('hidInput').blur();await startCamera()}}function sendHid(){let v=hidBuffer.trim();hidBuffer='';$('hidInput').value='';if(v)scan(v);setTimeout(()=>{if(mode==='reader'&&!locked)$('hidInput').focus()},30)}document.addEventListener('keydown',e=>{if(mode!=='reader'||locked)return;if(e.key==='Enter'||e.key==='Tab'){e.preventDefault();clearTimeout(hidTimer);sendHid();return}if(e.key.length===1){hidBuffer+=e.key;clearTimeout(hidTimer);hidTimer=setTimeout(sendHid,120)}});document.addEventListener('click',e=>{if(mode==='reader'&&!locked&&!e.target.closest('button'))$('hidInput').focus()});function unlock(){if(pinCode===PASS){alarmOff();locked=false;$('ng').classList.remove('show');box=loc='';$('box').textContent=$('loc').textContent='―';phase=2;$('guide').textContent='カンバンQRを読んでください';steps('done','on','');status('解除しました');ding();last='';lastAt=0;pinCode='';if(mode==='reader')setTimeout(()=>$('hidInput').focus(),50)}else{$('err').textContent='パスワードが違います';pinCode='';showPin();$('err').textContent='パスワードが違います';buzz()}}function nextBox(){box=loc='';$('box').textContent=$('loc').textContent='―';phase=2;$('guide').textContent='カンバンQRを読んでください';steps('done','on','');status('次のカンバンをどうぞ');last='';lastAt=0;if(mode==='reader')setTimeout(()=>$('hidInput').focus(),50)}function resetWorker(){if(locked)return;worker=box=loc='';phase=1;$('name').textContent=$('box').textContent=$('loc').textContent='―';$('guide').textContent='名前のQRを読んでください';steps('on','','');status('名前QRをスキャンしてください');last='';lastAt=0;if(mode==='reader')setTimeout(()=>$('hidInput').focus(),50)}function downloadCSV(){let q=v=>'"'+String(v??'').replaceAll('"','""')+'"',rows=[['日時','作業者','カンバンQR','製品QR','判定'],...logs.map(x=>[x.datetime,x.worker,x.box,x.location,x.result])],csv='\uFEFF'+rows.map(r=>r.map(q).join(',')).join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='picotaro_history.csv';a.click()}async function activate(){try{await audioReady();tone(900,.1);$('start').style.display='none';status('カメラ起動中…');await startCamera()}catch(e){$('start').style.display='none';status('起動エラー：'+e)}};</script></body></html>
