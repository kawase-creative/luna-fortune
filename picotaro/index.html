<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>ピコ太郎｜QR照合</title><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><style>:root{--n:#092245;--r:#dc2626}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:#f4f7fb;color:#102033}.app{max-width:640px;height:100svh;margin:auto;padding:5px 7px;display:flex;flex-direction:column;overflow:hidden}.head{background:var(--n);color:#fff;padding:6px 12px;border-radius:12px;flex:none}.head h1{font-size:22px;line-height:1;margin:0}.head small{font-size:10px}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:4px 0;flex:none}.p{padding:5px 2px;border-radius:8px;background:#e2e8f0;text-align:center;font-size:13px;line-height:1.15;font-weight:800}.on{outline:2px solid var(--n);background:#dbeafe}.done{background:#dcfce7;color:#166534}.card{background:#fff;padding:5px 7px;border-radius:12px;min-height:0;display:flex;flex-direction:column;flex:1;overflow:hidden}.guide{text-align:center;font-size:16px;line-height:1.1;font-weight:900;color:var(--n);margin:1px 0 4px;flex:none}#reader{width:100%;height:clamp(190px,40svh,300px);min-height:0;border-radius:10px;overflow:hidden;background:#111;flex:none}#reader video{width:100%!important;height:100%!important;object-fit:cover!important}.result{margin-top:4px;padding:6px;border-radius:9px;background:#eef2f7;text-align:center;font-size:13px;line-height:1.15;font-weight:900;flex:none}.ok{background:#dcfce7;color:#166534}.data{margin-top:3px;font-size:10px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}.buttons{display:flex;gap:5px;margin-top:3px;flex:none}button{flex:1;border:0;border-radius:8px;padding:6px;font-size:11px;font-weight:800}.primary{background:var(--n);color:white}.start{position:fixed;inset:0;z-index:200;background:#092245;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}.start button{font-size:20px;background:#fff;color:#092245;padding:15px 28px;min-width:220px}.ng{display:none;position:fixed;inset:0;z-index:300;background:var(--r);color:#fff;align-items:center;justify-content:center;text-align:center;padding:18px}.ng.show{display:flex}.ng .x{font-size:65px;font-weight:1000}.ng h2{font-size:40px;margin:0 0 6px}.ng .codes{background:#ffffff20;border-radius:12px;padding:9px;margin:9px 0;font-size:15px}.ng label{display:block;font-size:16px;font-weight:900;margin:9px 0 5px}.ng input{width:190px;text-align:center;font-size:27px;letter-spacing:9px;padding:9px;border:3px solid #fff;border-radius:10px;background:#fff;color:#111}.ng button{display:block;width:190px;margin:7px auto 0;background:#fff;color:#b91c1c;font-size:17px}.err{height:20px;font-weight:900;margin-top:5px}@media(max-height:700px){.app{padding:3px 5px}.head{padding:4px 10px}.head h1{font-size:19px}.head small{font-size:9px}.steps{margin:3px 0}.p{padding:4px 1px;font-size:12px}.card{padding:4px 6px}.guide{font-size:14px;margin-bottom:3px}#reader{height:35svh;min-height:175px;max-height:230px}.result{margin-top:3px;padding:5px;font-size:12px}.data{font-size:9px}.buttons{margin-top:2px}.buttons button{padding:5px;font-size:10px}}@media(max-height:600px){#reader{height:31svh;min-height:145px}.head small{display:none}.data{display:none}}</style></head><body><div id="start" class="start"><div><h1>ピコ太郎</h1><p>音声とカメラを有効にします</p><button onclick="activate()">▶ 照合を開始</button></div></div><div id="ng" class="ng"><div><div class="x">×</div><h2>NG</h2><div>ロケが違います</div><div class="codes">箱：<b id="abox"></b><br>ロケ：<b id="aloc"></b></div><label for="pass">解除パスワード</label><input id="pass" type="tel" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="••••"><button onclick="unlock()">解除する</button><div id="err" class="err"></div></div></div><div class="app"><div class="head"><h1>ピコ太郎</h1><small>QR照合・ポカヨケ</small></div><div class="steps"><div id="s1" class="p on">① 名前</div><div id="s2" class="p">② 箱</div><div id="s3" class="p">③ ロケ</div></div><div class="card"><div id="guide" class="guide">名前のQRを読んでください</div><div id="reader"></div><div id="result" class="result">開始ボタンを押してください</div><div class="data">作業者：<b id="name">―</b>　箱：<b id="box">―</b>　ロケ：<b id="loc">―</b>　履歴：<b id="count">0</b>件</div><div class="buttons"><button onclick="resetWorker()">作業者変更</button><button class="primary" onclick="downloadCSV()">CSV出力</button></div></div></div><script>const PASS='0000',$=x=>document.getElementById(x);let phase=1,worker='',box='',loc='',locked=false,last='',lastAt=0,timer=null,ac=null,qr=null,master=null;let logs=JSON.parse(localStorage.getItem('picotaro_logs')||'[]');$('count').textContent=logs.length;async function audioReady(){ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')await ac.resume();master=master||ac.createDynamicsCompressor();master.threshold.value=-24;master.knee.value=8;master.ratio.value=10;master.attack.value=.002;master.release.value=.12;master.connect(ac.destination)}function tone(f,d,delay=0,type='sine',vol=.95){try{let o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+delay;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d)}catch(e){}}function scanBeep(){tone(1600,.1,0,'square',1)}function ding(){tone(760,.22,0,'square',1);tone(1200,.34,.18,'square',1);tone(1500,.22,.4,'square',.95)}function buzz(){tone(210,.5,0,'sawtooth',1);tone(105,.55,.22,'square',1);tone(210,.45,.55,'sawtooth',1)}function alarmOn(){buzz();timer=setInterval(buzz,1150)}function alarmOff(){clearInterval(timer);timer=null}function steps(a,b,c){$('s1').className='p '+a;$('s2').className='p '+b;$('s3').className='p '+c}function status(x,ok=false){$('result').className='result'+(ok?' ok':'');$('result').textContent=x}function save(r){let n=new Date();logs.push({datetime:n.toLocaleString('ja-JP'),worker,box,location:loc,result:r});localStorage.setItem('picotaro_logs',JSON.stringify(logs));$('count').textContent=logs.length}function scan(text){if(locked)return;text=text.trim();let n=Date.now();if(!text||(text===last&&n-lastAt<350))return;last=text;lastAt=n;if(ac&&ac.state==='suspended')ac.resume();scanBeep();if(phase===1){worker=text;$('name').textContent=text;phase=2;$('guide').textContent='箱のQRを読んでください';steps('done','on','');status('名前 OK：'+text,true)}else if(phase===2){box=text;$('box').textContent=text;phase=3;$('guide').textContent='ロケのQRを読んでください';steps('done','done','on');status('箱：'+text)}else{loc=text;$('loc').textContent=text;if(box===loc){ding();save('OK');status('ピンポン！！ OK',true);steps('done','done','done');setTimeout(nextBox,700)}else{save('NG');locked=true;$('abox').textContent=box;$('aloc').textContent=loc;$('pass').value='';$('err').textContent='';$('ng').classList.add('show');alarmOn();setTimeout(()=>$('pass').focus(),120)}}}function unlock(){if($('pass').value===PASS){alarmOff();locked=false;$('ng').classList.remove('show');$('pass').blur();box=loc='';$('box').textContent=$('loc').textContent='―';phase=2;$('guide').textContent='箱のQRを読んでください';steps('done','on','');status('解除しました');ding();last='';lastAt=0}else{$('err').textContent='パスワードが違います';$('pass').value='';$('pass').focus();buzz()}}$('pass').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});function nextBox(){box=loc='';$('box').textContent=$('loc').textContent='―';phase=2;$('guide').textContent='箱のQRを読んでください';steps('done','on','');status('次の箱をどうぞ');last='';lastAt=0}function resetWorker(){if(locked)return;worker=box=loc='';phase=1;$('name').textContent=$('box').textContent=$('loc').textContent='―';$('guide').textContent='名前のQRを読んでください';steps('on','','');status('名前QRをスキャンしてください');last='';lastAt=0}function downloadCSV(){let q=v=>'"'+String(v??'').replaceAll('"','""')+'"',rows=[['日時','作業者','箱QR','ロケQR','判定'],...logs.map(x=>[x.datetime,x.worker,x.box,x.location,x.result])],csv='\uFEFF'+rows.map(r=>r.map(q).join(',')).join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='picotaro_history.csv';a.click()}async function activate(){try{await audioReady();tone(950,.1);$('start').style.display='none';status('カメラ起動中…');let cams=await Html5Qrcode.getCameras();if(!cams.length)throw Error('カメラなし');let rear=cams.find(c=>/back|rear|environment|背面/i.test(c.label))||cams[cams.length-1];qr=new Html5Qrcode('reader',{formatsToSupport:[Html5QrcodeSupportedFormats.QR_CODE],useBarCodeDetectorIfSupported:true});await qr.start(rear.id,{fps:45,qrbox:(w,h)=>({width:Math.floor(w*.98),height:Math.floor(h*.94)}),aspectRatio:1.333334,disableFlip:true,videoConstraints:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080},frameRate:{ideal:60,min:30,max:60}}},scan,()=>{});let track=document.querySelector('#reader video')?.srcObject?.getVideoTracks?.()[0];if(track){let caps=track.getCapabilities?.()||{};let adv=[];if(caps.focusMode?.includes('continuous'))adv.push({focusMode:'continuous'});if(caps.zoom){let z=Math.min(caps.zoom.max||1,Math.max(caps.zoom.min||1,1.7));adv.push({zoom:z})}if(adv.length)try{await track.applyConstraints({advanced:adv})}catch(e){}}status('QRをカメラへ向けてください')}catch(e){$('start').style.display='none';status('起動エラー：'+e)}};</script></body></html>
